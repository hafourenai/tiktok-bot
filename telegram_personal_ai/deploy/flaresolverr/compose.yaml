name: baak-flaresolverr
services:
  flaresolverr:
    image: ${FLARESOLVERR_IMAGE:-ghcr.io/flaresolverr/flaresolverr:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      TZ: Asia/Jakarta
    shm_size: 512mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmkg-location-resolver"
version = "0.1.0"
description = "Async Indonesian location resolution and validated BMKG weather forecasts"
readme = "docs/resolver.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<0.29", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]
formatted = ["pdfplumber>=0.11,<1", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "python-pptx>=0.6,<1", "reportlab>=4.0,<5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bmkg_location_resolver*", "converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
